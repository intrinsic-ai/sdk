syntax = "proto3";

package intrinsic_proto.motion_planning.v1;

import "google/protobuf/duration.proto";
import "intrinsic/world/proto/collision_checker_config.proto";

option go_package = "intrinsic/motion_planning/proto/v1/motion_planner_config_go_proto";

// Contains motion planning specific configurations.
message MotionPlannerConfiguration {
  // Maximum time in seconds available for motion planning. Default is 180
  // seconds.
  optional google.protobuf.Duration timeout_sec = 1;

  optional double path_planning_step_size = 4;

  // Configuration for saving or loading this motion.
  optional LockMotionConfiguration lock_motion_configuration = 3;

  // If true, the cache will not check for fuzzy matches. Default to false.
  optional bool skip_fuzzy_cache_check = 5;

  // If true, joint_shortcutter will remove all config nodes from input path
  // that are collinear. This speeds up shortcutting time but can result in
  // longer paths.
  optional bool shortcutting_combine_collinear_segments = 6;

  // Overrides the default collision checker configuration. This will affect
  // planning time and potentially the generated solution.
  optional intrinsic_proto.world.CollisionCheckerConfig
      collision_checker_config = 7;

  // Spacing between collision checks (in the joint space of the robot). If this
  // value is unset, motion planning will use a default value of 0.01. If
  // additional accuracy is required, this value can be set with a value smaller
  // than the default. Setting this to a value greater than the default will
  // result in a motion planning error.
  optional double collision_check_spacing_override = 8;

  reserved 2;
  reserved "use_projection_onto_constraint_manifold";
}

// Contains lock motion specific configurations.
message LockMotionConfiguration {
  message SaveMotionCommand {
    reserved 1;
    reserved "motion_id";
  }
  message LoadMotionCommand {
    // The motion id to load.
    string motion_id = 1;
    // The motion segments to replan.
    repeated uint32 replan_motion_segment_ids = 2;
  }

  oneof command {
    SaveMotionCommand save_motion_command = 1;
    LoadMotionCommand load_motion_command = 2;
  }
}

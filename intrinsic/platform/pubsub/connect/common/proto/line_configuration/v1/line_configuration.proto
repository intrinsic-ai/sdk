syntax = "proto3";

package intrinsic_proto.pubsub.connect.common.line_configuration.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "intrinsic/platform/pubsub/connect/common/proto/line_configuration/v1/endpoint_spec.proto";

// Configuration of a factory line.
message LineConfiguration {
  option (google.api.resource) = {
    type: "intrinsic_proto.pubsub.connect.common.line_configuration.v1/LineConfiguration"
    pattern: "factoryLines/{factory_line}"
  };
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  EndpointSpec hub_endpoint = 2 [(google.api.field_behavior) = REQUIRED];

  repeated EndpointSpec spoke_endpoints = 3;
}

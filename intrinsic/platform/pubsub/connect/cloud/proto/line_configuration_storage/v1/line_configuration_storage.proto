syntax = "proto3";

package intrinsic_proto.pubsub.connect.cloud.line_configuration_storage.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "intrinsic/platform/pubsub/connect/common/proto/line_configuration/v1/line_configuration.proto";

// Request to persist line configuration.
message UpdateLineConfigurationRequest {
  // Configuration to persist.
  intrinsic_proto.pubsub.connect.common.line_configuration.v1.LineConfiguration
      line_configuration = 1;

  // When true, and the line configuration is not found,
  // a new configuration will be created. The update_mask
  // will be ignored in this case.
  bool allow_missing = 3;
}

// Request to read stored line configuration.
message GetLineConfigurationRequest {
  // AIP-122 name of the line
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "intrinsic_proto.pubsub.connect.common.line_configuration.v1.LineConfiguration"
    }
  ];
}

// Request to delete line configuration.
message DeleteLineConfigurationRequest {
  // AIP-122 name of the line
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "intrinsic_proto.pubsub.connect.common.line_configuration.v1.LineConfiguration"
    }
  ];
}

// LineConfigurationStorageService is used for CRUD operations on
// factory line configurations.
service LineConfigurationStorageService {
  rpc GetLineConfiguration(GetLineConfigurationRequest)
      returns (intrinsic_proto.pubsub.connect.common.line_configuration.v1
                   .LineConfiguration) {}
  rpc UpdateLineConfiguration(UpdateLineConfigurationRequest)
      returns (intrinsic_proto.pubsub.connect.common.line_configuration.v1
                   .LineConfiguration) {}
  rpc DeleteLineConfiguration(DeleteLineConfigurationRequest)
      returns (google.protobuf.Empty) {}
}

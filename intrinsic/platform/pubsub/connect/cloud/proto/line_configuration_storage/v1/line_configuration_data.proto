syntax = "proto3";

package intrinsic_proto.pubsub.connect.cloud.line_configuration_storage.v1;

import "intrinsic/platform/pubsub/connect/common/proto/line_configuration/v1/line_configuration.proto";
import "google/protobuf/timestamp.proto";

// Line configuration with additional information that is
// stored in Firestore.
message LineConfigurationData {
  // Configuration of a factory line.
  intrinsic_proto.pubsub.connect.common.line_configuration.v1.LineConfiguration
      line_configuration = 1;

  // Time when that configuration was created.
  google.protobuf.Timestamp last_update_timestamp = 2;
}

syntax = "proto3";

package intrinsic_proto.geometry.v1;

import "intrinsic/math/proto/matrix.proto";
import "intrinsic/math/proto/vector3.proto";

option go_package = "intrinsic/geometry/proto/v1/geometric_transform_go_proto";

// A proto representation of a geometric transform. It allows for both an
// affine matrix representation and a Translation/Rotation/Scale representation.
message GeometricTransform {
  // Represents a transform using Translation, Rotation, and Scale (TRS).
  // The combined transform maps a point p to:
  //   p' = Rotation * (Scale * p) + Translation
  // where '*' for Scale is element-wise multiplication.
  // This is equivalent to the matrix multiplication M = T * R * S,
  // where T is translation, R is rotation, and S is scale.
  // This representation only supports affine transforms without shear.
  message TRS {
    // Example with 3 rotations (one for each axis):
    //   Given Roll (r) = pi/2, Pitch (p) = pi/2, Yaw (y) = pi/2 (all 90
    //   degrees). And a point p = [1.0, 2.0, 3.0].
    //
    //   The combined rotation matrix R is:
    //     R = R_z(pi/2) * R_y(pi/2) * R_x(pi/2)
    //       = |  0  0  1 |
    //         |  0  1  0 |
    //         | -1  0  0 |
    //
    //   Applying R to point p:
    //     p' = R * p = [3.0, 2.0, -1.0]
    //
    //   This is equivalent to applying the rotations extrinsically (around
    //   fixed axes):
    //     1. Rotate p around fixed X by 90 deg:  p1 = [1.0, -3.0, 2.0]
    //     2. Rotate p1 around fixed Y by 90 deg: p2 = [2.0, -3.0, -1.0]
    //     3. Rotate p2 around fixed Z by 90 deg: p' = [3.0, 2.0, -1.0]
    //
    // Represents a rotation as Roll, Pitch, Yaw in radians.
    // The rotation is applied as the extrinsic XYZ rotation (intrinsic ZYX),
    // i.e. RotationRPY = R_z(y) * R_y(p) * R_x(r).
    message RotationRPY {
      double r = 1;
      double p = 2;
      double y = 3;
    }

    // Translation to apply in meters.
    optional intrinsic_proto.Vector3 translation = 1;
    // Rotation to apply.
    // The rotation is applied after scaling and before translation, as defined
    // by the TRS transform formula.
    optional RotationRPY rotation_rpy = 2;
    // Scale to apply to the geometry. When not specified, defaults to 1,1,1.
    // Applied element-wise to the coordinate axes before rotation.
    optional intrinsic_proto.Vector3 scale = 3;
  }

  // Inspired by glTF
  // https://registry.khronos.org/glTF/specs/2.0/glTF-2.0.html#reference-node
  // matrix for machine generated transforms
  // TRS for more human friendly interfaces.
  oneof data {
    // A 4x4 affine transform matrix
    intrinsic_proto.Matrixd matrix4d = 1;

    // A TRS transform
    TRS trs = 2;
  }
}

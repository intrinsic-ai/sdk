syntax = "proto3";

package intrinsic_proto.performance.analysis.proto;

import "google/protobuf/struct.proto";

option go_package = "intrinsic/performance/analysis/proto/performance_metrics_go_proto";

message PerformanceMetrics {
  string cycle_number = 1;
  Metrics metrics = 2;
  string cluster = 3;
  string app_name = 4;
  string metric_name = 5;
}

message Metrics {
  google.protobuf.Struct metrics = 1;
}

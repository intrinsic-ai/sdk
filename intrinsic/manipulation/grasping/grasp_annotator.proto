syntax = "proto3";

package intrinsic_proto.grasping;

import "intrinsic/geometry/proto/oriented_bounding_box.proto";
import "intrinsic/geometry/proto/triangle_mesh.proto";
import "intrinsic/geometry/proto/v1/triangle_mesh.proto";
import "intrinsic/math/proto/pose.proto";
import "intrinsic/math/proto/vector2.proto";
import "intrinsic/math/proto/vector3.proto";

option go_package = "intrinsic/manipulation/grasping/grasp_annotator_go_proto";

message MeshData {
  message MeshBytesData {
    // The mesh data as bytes.
    bytes mesh_bytes = 1;
    // The file type of the mesh bytes, e.g.: "glb", "obj", "stl".
    string file_type = 2;
  }
  oneof mesh_data {
    // The triangle mesh with of the part with both faces and vertices specified
    // within. The expectation is three dimensional vertices and triangles for
    // the faces. Specified in row major order.
    intrinsic_proto.geometry.TriangleMesh triangle_mesh = 1 [deprecated = true];
    // The triangle mesh with of the part with both faces and vertices specified
    // within. The expectation is three dimensional vertices and triangles for
    // the faces. Specified in row major order.
    intrinsic_proto.geometry.v1.TriangleMesh triangle_mesh_v1 = 4;
    // The path to a mesh.
    string mesh_path = 2;
    // The mesh bytes with the file type.
    MeshBytesData mesh_bytes = 3;
  }
}

message ParameterizedGripperSpecs {
  oneof gripper_specs {
    // The specifications for a parameterized suction type gripper.
    ParameterizedSuctionGripperSpecs suction_gripper_specs = 1;
    // The specifications for a parameterized pinch type gripper.
    ParameterizedPinchGripperSpecs pinch_gripper_specs = 2;
    // The specifications for a parameterized centric type gripper.
    ParameterizedCentricGripperSpecs centric_gripper_specs = 3;
    // EXPERIMENTAL: The specifications for a parameterized V-notch pinch type
    // gripper. Only usable if the grasp annotator service is configured with
    // `flags.enable_v_notch_pinch_gripper = true`; otherwise the service
    // rejects the request.
    ParameterizedVNotchPinchGripperSpecs v_notch_pinch_gripper_specs = 4;
  }
}

message ParameterizedSuctionGripperSpecs {
  // The radius of the suction cup in meters.
  float radius_in_meters = 1;
  // The surface roughness threshold of the suction cup in meters.
  // This is a measure of the "flatness" of the contact surface. Defaults to
  // a lower bounded value of 0.003 meters, enter a larger value for more
  // aggressive filtering.
  optional float surface_roughness_threshold_in_meters = 2;
  // The 2D coordinates of the suction cup locations in meters in the x-y plane
  // of the tool frame where z = 0.
  repeated Vector2 suction_cup_coordinates = 3;
  // The rotation increment to search for grasp annotations in radians.
  // The default value is pi/4 radians.
  optional float rotation_increment_in_radians = 4;
  // The maximum rotation to stop searching for grasp annotations in radians.
  // The default value is pi radians.
  optional float max_rotation_in_radians = 5;
  // The transform to apply to the suction gripper relative to its origin.
  // By default, the gripper z-axis points towards the object.
  optional Pose gripper_origin_t_tool_frame = 6;
}

message ParameterizedPinchGripperSpecs {
  // The opening of the gripper in meters.
  float opening_in_meters = 1;
  // The width of the finger in meters.
  float finger_width_in_meters = 2;
  // The length of the finger in meters.
  float finger_length_in_meters = 3;
  // The minimum closing distance of the gripper in meters. Should be a
  // non-negative value less than the opening of the gripper. By default, the
  // value is assumed to be 0.0, i.e., the gripper closes completely.
  optional float min_closing_distance_in_meters = 6;
  // The antipodal threshold in radians. If the two surface normals on the
  // object is larger than the threshold, the pose is considered as antipodal.
  // The default value is 3.0 radians.
  optional float antipodal_threshold_in_radians = 4;
  // The transform to apply to the pinch gripper relative to its origin.
  // By default, the gripper z-axis points towards the object, y-axis is algined
  // to the gripper opening direction, and x-axis is aligned to the gripper
  // finger width.
  optional Pose gripper_origin_t_tool_frame = 5;
  // The additional collision mesh of the gripper.
  // The mesh is assumed to be relative to the tool frame.
  optional MeshData collision_mesh = 7;
}

message ParameterizedVNotchPinchGripperSpecs {
  // The maximum opening between fingers in meters.
  float opening_in_meters = 1;
  // The width of each finger in meters.
  float finger_width_in_meters = 2;
  // The length of each finger in meters.
  float finger_length_in_meters = 3;
  // The dimension of each finger along the opening axis. Must be larger than
  // `notch_depth_in_meters` to provide structural back-wall for the V-notch.
  // Defaults to `notch_depth_in_meters` plus a default thickness of 1 mm.
  optional float finger_thickness_in_meters = 4;
  // The position of the V-notch vertex along the direction of the finger
  // length, measured from the base of the finger. To avoid a degenerate
  // V-notch extending beyond the finger boundaries
  // [0, `finger_length_in_meters`], this value must lie in the range
  // [notch_semi_opening, `finger_length_in_meters` - notch_semi_opening], with
  // notch_semi_opening = `notch_depth_in_meters` *
  // tan(0.5 * `notch_angle_in_radians`).
  float notch_offset_in_meters = 5;
  // Depth of the V-notch in meters.
  float notch_depth_in_meters = 6;
  // The full included angle of the V-notch in radians, in the range (0, pi).
  float notch_angle_in_radians = 7;
  // The minimum closing distance between fingers in meters, in the range
  // [0, `opening_in_meters`]. Defaults to 0, i.e., the gripper closes
  // completely.
  optional float min_closing_distance_in_meters = 8;
  // The transform expressing the pinch gripper tool frame relative to the tool
  // origin. By default, the gripper z-axis points out of the gripper along the
  // finger main axis, the y-axis is aligned to the gripper opening.
  // direction, and x-axis is aligned to the gripper finger width.
  optional Pose gripper_origin_t_tool_frame = 9;
  // Optional collision mesh of the gripper. The mesh is assumed to be relative
  // to the tool frame.
  optional MeshData collision_mesh = 10;
}

message ParameterizedCentricGripperSpecs {
  // The maximum opening radius of the gripper in meters.
  float opening_radius_in_meters = 1;
  // The minimum closing radius of the gripper in meters, must be less than the
  // opening radius.
  float closing_radius_in_meters = 2;
  // The length of the gripper fingers in meters.
  float finger_length_in_meters = 3;
  // The thickness of fingers in meters, defaults to 0.01 meters.
  optional float finger_thickness_in_meters = 4;
  // The number of rotations to search for grasp annotations.
  // The default value is 8.
  optional int32 num_rotations = 5;
  // Minimum increment in meter to search for along the axis of the cylinder.
  // The default value is 0.005, must be greater than 0.001.
  optional float min_search_increment_in_meters = 6;
  // The transform to apply to the centric gripper relative to its origin.
  // By default, the gripper z-axis points towards the object.
  optional Pose gripper_origin_t_tool_frame = 7;
}

// The weights of the metrics to use for scoring annotation. Weights should be
// non-negative, and are used to compute the weighted geometric mean of the
// respective metrics. Only specified metrics are used for scoring annotation.
message MetricWeights {
  // The weight of the distance to center of mass metric. When unspecified, the
  // metric is not used for scoring annotation.
  optional float distance_to_center_of_mass_weight = 1;
  // The weight of the distance to bounding box corner metric. When unspecified,
  // the metric is not used for scoring annotation.
  optional float distance_to_bounding_box_corner_weight = 2;
}

message GraspAnnotationConstraint {
  oneof Constraint {
    // The bounding box to filter grasp poses, in base frame of the object.
    BoundingBoxConstraint bounding_box_constraint = 1;
    // Axis constraint to filter grasp poses.
    AxisConstraint axis_constraint = 2;
  }
  // The minimum contact area between the finger and the object, expressed as
  // a percentage of the finger area (width x length). Annotations with the
  // contact area below this will be filtered out.
  // Defaults to 0.0. Must be within [0.0, 1.0].
  // This will be satisfied for each finger and will be ignored
  // if not using a ParameterizedPinchGripper.
  optional float min_finger_contact_area = 3;

  message BoundingBoxConstraint {
    repeated intrinsic_proto.geometry.OrientedBoundingBox3
        oriented_bounding_boxes = 1;
    // Only select grasp poses outside the box, defaults to false.
    optional bool exclude_poses_in_box = 2;
  }

  message AxisConstraint {
    // The axis to filter grasp poses by, in the base frame of the object.
    // Grasp poses are filtered out if the Z-axis of the grasp pose is not
    // aligned and in the same direction as the axis.
    repeated intrinsic_proto.Vector3 axis = 1;
    // The angle tolerance in radians to filter grasp poses. The default value
    // is 0.01 radians.
    optional float angle_tolerance_in_radians = 2;
  }
}

message SamplingOptions {
  // Add additional samples (on top of num_samples) along the center lines of
  // each face. Number of additonal samples are computed based on object
  // dimensions and spacing. Defaults to true.
  optional bool centered_samples = 1;
  // Minimum distance between samples in meters, defaults to 0.005m.
  optional float min_sample_distance_in_meters = 2;
}

// A check of the grasp annotation pipeline. One `StageCount` reports the
// outcome of one check. The checks of a request run in the order of
// `stage_breakdown`, which is not the order of the values below, and each
// candidate is counted in the first check it fails, even if it would also fail
// a later one: a suction pose over a hole is counted under
// `SUCTION_CUP_OVER_HOLE` and not under `SURFACE_ROUGHNESS_EXCEEDED`.
enum AnnotationCheck {
  ANNOTATION_CHECK_UNSPECIFIED = 0;
  // Suction: surface deviation under the cups exceeds the effective
  // `surface_roughness_threshold_in_meters`.
  SURFACE_ROUGHNESS_EXCEEDED = 1;
  // Suction: at least one cup sample point is over a hole / off the surface
  // (share of cup sample points hitting the surface is below 1.0, fraction).
  SUCTION_CUP_OVER_HOLE = 2;
  // Pinch: the surface normals of an entry/exit point pair are not antipodal
  // within `antipodal_threshold_in_radians`. The candidates of this stage are
  // entry/exit point pairs: a ray with four or more hits yields several.
  INSUFFICIENT_ANTIPODAL_NORMALS = 3;
  // Pinch: pair width <= `min_closing_distance_in_meters`.
  MIN_CLOSING_DISTANCE_VIOLATED = 4;
  // Pinch: pair width >= `opening_in_meters`.
  OPENING_EXCEEDED = 5;
  // Pinch: no surface within `finger_length_in_meters` of the grasp line to
  // align the fingers to.
  NO_CONTACT_SURFACE_IN_FINGER_REACH = 6;
  // Pinch (finger grippers): the gripper mesh collides with the object at the
  // candidate pose. This stage evaluates poses (each surviving contact pair
  // times its approach normals), so its `input_count` is usually larger than
  // the previous stage's `output_count`.
  FINGER_COLLISION_WITH_PART = 7;
  // Centric / V-notch pinch: the radius of the cylinder fitted to the object is
  // outside the gripper's graspable radius bounds.
  INCOMPATIBLE_RADIAL_DIMENSION = 8;
  // Constraint: finger contact area in m^2 below `min_finger_contact_area`
  // times the finger area (width * length).
  INSUFFICIENT_CONTACT_AREA = 9;
  // Constraint: pose excluded by `bounding_box_constraint`.
  BOUNDING_BOX_CONSTRAINT_EXCLUDED = 10;
  // Constraint: smallest angle between the approach axis and an allowed axis in
  // `axis_constraint` exceeds `angle_tolerance_in_radians` (rad).
  AXIS_CONSTRAINT_MISALIGNED = 11;
  // Suction and parallel pinch sampling: a ray cast from the bounding box did
  // not hit the mesh, so no candidate was created for it. `input_count` is the
  // number of rays cast: the surface samples (`num_samples`, or fewer when
  // samples closer to each other than `min_sample_distance_in_meters` are
  // discarded) plus the rays added by `centered_samples`. `output_count` is the
  // number of rays that hit the mesh. The rays start on the bounding box
  // enlarged by a small margin, so some of them miss even a solid part.
  RAY_MISSED_SURFACE = 12;
  // Parallel pinch sampling: the ray hit the mesh only once, so there is no
  // opposing surface to close the fingers on. Typical for a mesh with a missing
  // face or for a surface without thickness.
  RAY_SINGLE_HIT = 13;
  // Centric / V-notch pinch: the object mesh is not sufficiently cylindrical
  // for cylinder-based grasp sampling (the convex-hull-to-bounding-cylinder
  // volume ratio is below `threshold`, or `0.0` when the mesh has negligible
  // convex-hull volume).
  INCOMPATIBLE_OBJECT_SHAPE = 14;
}

// A rejected candidate of one stage. What is common to all candidates of the
// stage (the check and the limit) lives on the enclosing StageCount.
message RejectedAnnotation {
  // Pose of the gripper's tool frame in the object frame, the same convention
  // as `ManualGraspAnnotation.ref_t_annotation` in the returned annotations.
  // Unset for `INCOMPATIBLE_OBJECT_SHAPE` and `INCOMPATIBLE_RADIAL_DIMENSION`,
  // which reject before any pose is sampled.
  intrinsic_proto.Pose sample_pose = 1;
  // This candidate's value of the stage's tested quantity, in the unit of
  // StageCount.threshold. Unset for stages without a scalar limit (collision,
  // bounding box, ray sampling).
  optional double measured_value_against_threshold = 2;
  // What the scalar does not capture, e.g. the colliding gripper link.
  optional string debug_message = 3;
}

// One stage of the annotation funnel. Stages only see the survivors of the
// previous stage, so the first stage with `output_count == 0` explains an
// empty result.
message StageCount {
  // The check this stage applied.
  AnnotationCheck stage_name = 1;
  // Candidates the stage evaluated. This is the `output_count` of the previous
  // stage unless the kind of candidate changes between the two, for example
  // from multi-hit rays to entry/exit point pairs
  // (`INSUFFICIENT_ANTIPODAL_NORMALS`), from contact pairs to poses
  // (`FINGER_COLLISION_WITH_PART`, one pose per pair and approach normal), from
  // surface points to the poses of a suction gripper with several cups
  // (`SUCTION_CUP_OVER_HOLE`, one pose per point and rotation angle), or from
  // the fitted cylinder to the poses sampled on it (the stage after
  // `INCOMPATIBLE_RADIAL_DIMENSION`).
  optional int64 input_count = 2;
  // Candidates that passed this stage and survived to the next stage.
  optional int64 output_count = 3;
  // Effective limit the stage applied, after defaults and clamping, in the
  // unit of the check (rad for antipodal normals and axis constraint, hit
  // fraction in [0, 1] for suction cup over hole, volume ratio in [0, 1] for
  // object shape, m^2 for contact area, m otherwise). Unset for stages without
  // a scalar limit (collision, bounding box, ray sampling). Every stage tests a
  // single bound: the pinch width window is checked by two stages
  // (`MIN_CLOSING_DISTANCE_VIOLATED` and `OPENING_EXCEEDED`), and for
  // `INCOMPATIBLE_RADIAL_DIMENSION` this is the bound the radius violated (the
  // minimum if the radius is below it, otherwise the maximum).
  optional double threshold = 4;
  // Rejected candidates ordered by proximity to `threshold` (nearest first, or
  // in evaluation order for stages without a scalar limit). Usually a subset
  // of the stage's rejections: `input_count - output_count` is the number of
  // candidates the stage dropped.
  repeated RejectedAnnotation rejected_annotations = 5;
  // Wall time spent in this stage, in seconds.
  optional double total_execution_time_sec = 6;
}

// Per-stage breakdown of the grasp annotation candidate funnel.
message GraspAnnotationDiagnostics {
  // Stages of the annotation funnel in pipeline order. For suction and parallel
  // pinch grippers the first stage is `RAY_MISSED_SURFACE`, whose `input_count`
  // is the number of rays cast. For centric and V-notch pinch grippers it is
  // `INCOMPATIBLE_RADIAL_DIMENSION` with an `input_count` of 1: the radius
  // check of the cylinder fitted to the object (a mesh that no cylinder fits
  // fails the request with an error instead).
  repeated StageCount stage_breakdown = 1;
  // Number of annotations that passed every stage but were not returned because
  // of `max_num_annotations` (the lowest-scored ones when scoring metrics are
  // given). 0 if `max_num_annotations` is unset, not positive or not reached.
  int64 num_truncated_by_max_num_annotations = 2;
}

syntax = "proto3";

package intrinsic_proto.grasping.service.grasp_planner_service.v2;

import "google/rpc/status.proto";
import "intrinsic/assets/proto/field_metadata.proto";
import "intrinsic/assets/proto/id.proto";
import "intrinsic/assets/proto/v1/resolved_dependency.proto";
import "intrinsic/logging/proto/context.proto";
import "intrinsic/manipulation/grasping/grasp.proto";
import "intrinsic/manipulation/grasping/grasp_annotations.proto";
import "intrinsic/manipulation/grasping/grasp_ranker_params.proto";
import "intrinsic/manipulation/proto/workspace.proto";
import "intrinsic/world/proto/object_world_refs.proto";
import "intrinsic/world/proto/object_world_service.proto";
import "intrinsic/world/proto/object_world_updates.proto";

option go_package = "intrinsic/manipulation/service/grasp_planner_service/v2/grasp_planner_service_go_proto";

// Configuration of the GraspPlannerService asset. Declares the services the
// grasp planner depends on; they are resolved by the asset system at install
// time.
message GraspPlannerServiceConfig {
  // The resolved dependency for the Intrinsic runtime. Used to read the world
  // (targets, frames, collision geometry), to look up object meshes for
  // box-shaped annotations, to load scene objects for `pose_estimates`, and to
  // resolve the organization and workcell that logging ids are made of.
  intrinsic_proto.assets.v1.ResolvedDependency intrinsic_runtime = 1
      [(intrinsic_proto.assets.field_metadata).dependency = {
        requires: "grpc://intrinsic_proto.assets.v1.InstalledAssetsReader"
        requires: "grpc://intrinsic_proto.data_logger.DataLogger"
        requires: "grpc://intrinsic_proto.geometry.GeometryService"
        requires: "grpc://intrinsic_proto.world.ObjectWorldService"
      }];

  // The `MotionPlannerService` (MPS) used for IK-based reachability and
  // collision checks of grasp/pregrasp poses.
  intrinsic_proto.assets.v1.ResolvedDependency motion_planner_service = 2 [
    (intrinsic_proto.assets.field_metadata).dependency = {
      requires: "grpc://intrinsic_proto.motion_planning.v1.MotionPlannerService"
    }
  ];

  // The GraspAnnotator service. Only needed to resolve
  // `GraspAnnotations.stored_annotations`; requests using stored annotations
  // fail with FAILED_PRECONDITION if this is unset.
  optional intrinsic_proto.assets.v1.ResolvedDependency
      grasp_annotator = 3 [(intrinsic_proto.assets.field_metadata)
                               .dependency = {
    requires: "grpc://intrinsic_proto.grasping.service.grasp_annotator_service.v1.GraspAnnotator"
  }];

  // If true, the service logs no `GraspPlannerDebugData` for requests that
  // don't set `PlanGraspsRequest.disable_logging`. Defaults to false, i.e.
  // logging is on.
  bool disable_logging = 4;
}

// Grasp targets given as explicit objects that already exist in the world.
message ObjectsTarget {
  // The objects to plan grasps for. Must not be empty.
  repeated intrinsic_proto.world.ObjectReference objects = 1;
}

// Grasp targets given as all world objects of one category that lie inside a
// bounding-box zone.
message GraspZone {
  // The scene object asset whose instances are considered as targets.
  intrinsic_proto.assets.Id object_category = 1
      [(intrinsic_proto.assets.field_metadata) = {
        is_installed_scene_object_asset: true
      }];
  // The zone, in which objects of `object_category` are considered as targets.
  intrinsic_proto.manipulation.OrientedBoundingBoxWorkspace grasp_bbox_zone = 2;
}

// Request for GraspPlannerService.PlanGrasps.
message PlanGraspsRequest {
  // ID of the world to plan in. The world is only read, never modified.
  string world_id = 1;

  // Name of the robot (kinematic object in `world_id`) that executes the grasp.
  string robot_name = 2;

  // The targets to plan grasps for. Exactly one must be set.
  oneof plan_targets {
    // Explicit objects that already exist in the world.
    ObjectsTarget candidate_objects = 3;
    // Pose estimates of objects that may not exist in the world yet. Missing
    // objects are created via `PlanGraspsResponse.world_updates`.
    intrinsic_proto.grasping.PoseEstimatesTarget pose_estimates = 4;
    // All objects of a category within a bounding-box zone.
    GraspZone grasp_zone = 5;
  }

  // Tool frame that is expected to coincide with the grasp pose when the
  // gripper is closed (e.g. the gripper tip frame).
  intrinsic_proto.world.TransformNodeReference tool_frame = 6;

  // Defines the candidate grasp poses relative to the target object
  // (box-shaped, manual, or stored annotations). Defaults to box-shaped
  // annotations derived from the target object's mesh if unset. For stored
  // annotations, an empty `annotations_id` defaults to "default" and an empty
  // `asset_id` to the name of the target's object category; an empty
  // `asset_id` with `candidate_objects` fails with INVALID_ARGUMENT, and
  // unknown stored annotations fail with FAILED_PRECONDITION.
  intrinsic_proto.grasping.GraspAnnotations grasp_annotations = 7;

  // Reachability and collision validation parameters for pregrasp/grasp
  // poses. Uses the planner defaults if unset.
  optional intrinsic_proto.grasping.GraspReachabilityParams
      reachability_params = 8;

  // Additional scoring heuristics (e.g. height, top-down) applied on top of
  // the collision checker to rank candidate grasps.
  optional intrinsic_proto.grasping.GraspScoringHeuristics
      additional_scoring_heuristics = 9;

  // Maximum number of grasps to return. Defaults to 1. Forced to 1 if
  // `output_grasp_frame` is set.
  optional int64 max_num_grasps = 10;

  // Distance in meters between grasp and pregrasp pose along the negative
  // z-axis of the tool frame. Defaults to 0.1.
  optional float retract_dist_m = 11;

  // Offset in meters applied to each grasp along the positive z-axis of the
  // tool frame (usually: deeper into the object). Defaults to 0.0.
  optional float grasp_frame_z_offset_m = 12;

  // Existing frame to be moved to the grasp pose of the best grasp. Must be
  // set together with `output_pregrasp_frame`. If set, `world_updates` contains
  // UpdateTransformRequests for these frames (they keep their parent) instead
  // of CreateFrameRequests under the target object.
  optional intrinsic_proto.world.TransformNodeReference output_grasp_frame = 13;

  // Existing frame to be moved to the pregrasp pose of the best grasp. Must be
  // set together with `output_grasp_frame`.
  optional intrinsic_proto.world.TransformNodeReference output_pregrasp_frame =
      14;

  // Logging context of the caller (e.g. of the calling skill). Copied into the
  // log items of the debug data the service logs for this request, so that they
  // can be joined with the caller's logs.
  intrinsic_proto.data_logger.Context context = 15;

  // If true, the service logs no `GraspPlannerDebugData` for this request and
  // `PlanGraspsResponse.logging_id` stays empty. If unset,
  // `GraspPlannerServiceConfig.disable_logging` decides.
  optional bool disable_logging = 16;

  // If true, the service creates no grasp and pregrasp frames for the returned
  // grasps: `world_updates` contains no CreateFrameRequests for them, and their
  // `grasp_frame` and `pre_grasp_frame` stay unset. Use their poses instead
  // (e.g. `root_t_grasp` or `object_t_grasp`). Target objects of
  // `pose_estimates` are still created. Has no effect if `output_grasp_frame`
  // and `output_pregrasp_frame` are set: they are updated instead of creating
  // frames. This avoids needing to clean up generated frames when reusing
  // object instances.
  bool disable_grasp_frames_generation = 17;

  // Maximum number of rejected candidates that
  // `PlanGraspsResponse.grasp_plan.filtered_grasps` lists per `FailedStage`,
  // in the order in which the planner examined them. The same number limits
  // `grasp_plan.unexamined_grasps`. Defaults to 10 if unset; 0 lists no
  // candidates. Must be in [0, 100]; values outside that range are rejected
  // with INVALID_ARGUMENT. Does not affect planning, the returned grasps, or
  // the failure diagnostics. The full numbers are reported in
  // `PlanGraspsResponse.rejected_stage_counts` and
  // `PlanGraspsResponse.num_unexamined_grasps`.
  optional int32 max_num_rejected_grasps_per_stage = 18;
}

// Response of GraspPlannerService.PlanGrasps. An empty `grasps` list is a
// valid (non-error) result; `failure_summary`, `failure_details`, and
// `failed_stage` explain why.
message PlanGraspsResponse {
  // Stage of the grasp planning funnel at which candidate grasps were rejected
  // when `PlanGrasps` returns no grasps. Values 1 to 16 are listed in funnel
  // order: scoring heuristics (which run in the order in which the request
  // lists them), pregrasp IK, grasp IK, straight-line approach, full
  // trajectory, postgrasp IK, placement IK.
  enum FailedStage {
    // Unspecified failure stage, or grasp planning succeeded (`grasps` is
    // non-empty). Clients should treat this value on an empty `grasps`
    // response as an unknown failure stage.
    FAILED_STAGE_UNSPECIFIED = 0;
    // Candidate grasp z-height in the world root frame was at or below
    // `HeightRankerParams.min_grasp_height` (heights above `max_grasp_height`
    // clip to score 1.0 and are not rejected).
    GRASP_HEIGHT = 1;
    // Candidate grasp approach direction was rejected by the top-down
    // heuristic (`TopDownGraspRankerParams.top_down_score_threshold`).
    TOP_DOWN_HEURISTIC = 2;
    // Candidate grasp had zero detection visibility when
    // `VisibilityRankerParams` was enabled
    // (`VisibilityRankerParams.visibility_threshold` deprioritizes positive
    // sub-threshold visibility by scaling its score by 0.01 rather than
    // rejecting it; only zero visibility scores 0.0 and is rejected).
    VISIBILITY_HEURISTIC = 3;
    // Pregrasp pose had no reachable IK solution within joint limits.
    PREGRASP_IK_UNREACHABLE = 4;
    // Pregrasp pose IK failed due to collision.
    PREGRASP_IK_COLLISION = 5;
    // Pregrasp pose IK failed without a more specific reachability or
    // collision classification.
    PREGRASP_IK_UNKNOWN = 6;
    // Grasp pose had no reachable IK solution within joint limits (seeded from
    // the pregrasp IK solution).
    GRASP_IK_UNREACHABLE = 7;
    // Grasp pose IK or pinch-gripper open/close finger collision check
    // (`reachability_params.pinch_gripper_params`) failed due to collision
    // (arm grasp-pose collision checking is disabled by default unless
    // `reachability_params.grasp_pose_collision_settings` enables it).
    GRASP_IK_COLLISION = 8;
    // Grasp pose IK or pinch-gripper open/close finger collision check
    // (`reachability_params.pinch_gripper_params`) failed without a more
    // specific reachability or collision classification.
    GRASP_IK_UNKNOWN = 9;
    // Linear Cartesian approach trajectory from pregrasp to grasp pose failed
    // (`reachability_params.check_straight_line_approach`).
    STRAIGHT_LINE_TRAJECTORY = 10;
    // Full trajectory from the robot's start configuration through pregrasp to
    // grasp pose failed (`reachability_params.check_full_trajectory`).
    FULL_TRAJECTORY = 11;
    // Postgrasp (retract) pose IK check had no reachable solution within joint
    // limits during placement constraint checking. This check is the first
    // step of placement constraint checking: it runs before the grasped object
    // is attached to the gripper and without collision checking.
    POSTGRASP_IK_UNREACHABLE = 12;
    // Postgrasp (retract) pose IK check failed during placement constraint
    // checking without a more specific classification.
    POSTGRASP_IK_UNKNOWN = 13;
    // Target placement pose (exact or within margins) or insertion waypoint IK
    // check had no reachable solution within joint limits. These checks run
    // after the postgrasp IK check, with the grasped object attached to the
    // gripper and with collision checking.
    PLACEMENT_IK_UNREACHABLE = 14;
    // Target placement pose or insertion waypoint IK check after attaching the
    // grasped object to the gripper failed due to collision.
    PLACEMENT_IK_COLLISION = 15;
    // Target placement pose or insertion waypoint IK check after attaching the
    // grasped object to the gripper failed without a more specific
    // reachability or collision classification.
    PLACEMENT_IK_UNKNOWN = 16;
    // Zero candidate grasps were proposed (for example no target objects in
    // `grasp_zone`, empty `pose_estimates.estimates`, or empty grasp
    // annotations).
    NO_CANDIDATES = 17;
  }

  // Number of candidate grasps that one stage of the planning funnel rejected.
  message RejectedStageCount {
    // The stage. `FAILED_STAGE_UNSPECIFIED` stands for rejected candidates
    // that no stage explains, for example the candidates of a pose estimate
    // with a score of 0.
    FailedStage stage = 1;
    // Number of candidates rejected at `stage`.
    int64 num_rejected_grasps = 2;
  }

  // Planned grasps expressed as world frame references, best grasp first.
  // `grasps[i]` corresponds to `grasp_plan.grasps[i]`. The referenced
  // grasp/pregrasp frames (and, for `pose_estimates`, the target objects) only
  // exist after `world_updates` has been applied to the world `world_id`; the
  // frames are unset with `disable_grasp_frames_generation`.
  // Each grasp's `root_t_grasp` / `root_t_pregrasp` give the grasp/pregrasp
  // poses in the root frame of `world_id` at planning time, and its
  // `object_t_grasp` / `object_t_pregrasp` give them relative to the grasped
  // object. The root poses can be used without applying `world_updates`.
  repeated intrinsic_proto.grasping.PoseBasedGrasp grasps = 1;

  // World updates (CreateObjectRequest, CreateFrameRequest,
  // UpdateTransformRequest) that make the references in `grasps` valid. They
  // are computed but not applied by the service; the caller applies them.
  // None of the contained requests has `world_id` set, so they can be passed
  // directly to `UpdateWorldResourcesRequest.world_updates` (e.g. via
  // `ObjectWorldClient.batch_update`) or recorded as preview world updates.
  intrinsic_proto.world.ObjectWorldUpdates world_updates = 2;

  // The raw grasp plan with the scoring history of its candidates. Intended
  // for debugging and logging. `filtered_grasps` lists at most
  // `PlanGraspsRequest.max_num_rejected_grasps_per_stage` rejected candidates
  // per stage, and `unexamined_grasps` at most that many candidates.
  intrinsic_proto.grasping.GraspPlan grasp_plan = 3;

  // Short, human-readable explanation why no grasp was found. Only set if
  // `grasps` is empty.
  optional string failure_summary = 4;

  // Detailed per-candidate diagnostics why no grasp was found. Only set if
  // `grasps` is empty.
  optional string failure_details = 5;

  // Unique id of the `GraspPlannerDebugData` the service logged for this
  // request; use it to find the request and response in the logs. Empty if
  // logging is disabled for the request (see
  // `PlanGraspsRequest.disable_logging`) or the service doesn't log (e.g. its
  // logging context isn't resolved yet).
  string logging_id = 6;

  // The stage that explains an empty `grasps` list, or
  // `FAILED_STAGE_UNSPECIFIED` when `grasps` is non-empty. When candidates
  // were rejected at several stages, this is the latest stage of the planning
  // funnel that rejected a candidate (see `FailedStage` for the order of the
  // stages). Among the outcomes of the same IK check (unreachable, collision,
  // unknown), it is the one that rejected the most candidates. Clients should
  // treat `FAILED_STAGE_UNSPECIFIED` on an empty `grasps` response as an
  // unknown failure stage.
  FailedStage failed_stage = 7;

  // Number of rejected candidates per stage, ordered by `stage`, for every
  // stage that rejected at least one candidate. Counts all rejected candidates,
  // including those omitted from `grasp_plan.filtered_grasps` due to exceeding
  // `PlanGraspsRequest.max_num_rejected_grasps_per_stage`. Also set when
  // `grasps` is non-empty.
  repeated RejectedStageCount rejected_stage_counts = 8;

  // Number of candidates the planner did not examine because it stopped early
  // (for example after it found `max_num_grasps` grasps), including those that
  // `grasp_plan.unexamined_grasps` does not list due to exceeding
  // `PlanGraspsRequest.max_num_rejected_grasps_per_stage`.
  int64 num_unexamined_grasps = 9;
}

// Debug data the service logs for each PlanGrasps request (unless logging is
// disabled, see `PlanGraspsRequest.disable_logging`), as payload
// `grasp_planner_debug_data` of a LogItem. The request is logged together
// with the world snapshot (and `resolved_annotations` when `stored_annotations`
// were fetched) before planning starts, so it is available even if the service
// crashes while planning. If the request fails before the snapshot is taken,
// it is logged without world right before the error. The response or the error
// is logged when the request completes. All log items of one request have the
// same `logging_id`, and exactly one of `request`, `response` and `error` is
// set in each of them.
message GraspPlannerDebugData {
  // Unique id of the request, equal to `PlanGraspsResponse.logging_id`.
  string logging_id = 1;

  // The request, as received by the service.
  PlanGraspsRequest request = 2;

  // The response returned by the service.
  PlanGraspsResponse response = 3;

  // The status the request failed with (e.g. INVALID_ARGUMENT if the request
  // is invalid).
  google.rpc.Status error = 4;

  // The world state the request was planned in, i.e. the snapshot of world
  // `request.world_id` the service reads the world from, for replaying the
  // request offline. Only set together with `request`, and only if the request
  // got as far as taking the snapshot. It carries the world's full collision
  // settings (from GetWorld, including the collision exclusion pairs), i.e. it
  // is exactly what the grasp rankers send as
  // `BatchCheckRequest.world_snapshot`.
  intrinsic_proto.world.World world = 5;

  // Grasp annotations the service resolved from `GraspAnnotator` when
  // `request.grasp_annotations` uses `stored_annotations`, so the request can
  // be replayed offline without a live GraspAnnotator. Unset for other
  // annotation types and when the request failed before the annotations were
  // fetched.
  optional intrinsic_proto.grasping.GraspAnnotations resolved_annotations = 6;
}

// General-purpose grasp planning service. It only reads the world and never
// modifies external state; resulting world changes are returned to the caller.
service GraspPlannerService {
  // Plans grasps for the given targets and computes the world updates needed
  // to represent them as frames in the world.
  rpc PlanGrasps(PlanGraspsRequest) returns (PlanGraspsResponse) {}
}

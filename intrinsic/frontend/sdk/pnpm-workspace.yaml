packages:
  - "angular"
  - "types"
  - "core"
  - "testing"
  - "world"

# Enforce a minimum release age to prevent trivial supply chain attacks.
minimumReleaseAge: 1440 # in minutes => 24h

# Disabling pnpm hoisting is recommended on projects using rules_js so that pnpm
# outside of Bazel lays out a node_modules tree similar to what rules_js lays
# out under Bazel (without a hidden node_modules/.pnpm/node_modules).
#
# See documentation for more information:
# https://github.com/aspect-build/rules_js/blob/main/docs/pnpm.md#hoisting
hoist: false

# Always install exact versions rather than ranges.
saveExact: true

# Allow installing dependencies to the root package.json without warnings.
ignoreWorkspaceRootCheck: true

# Packages that are allowed to run their build scripts.
allowBuilds: {}

# three-mesh-bvh's type definitions add members (e.g. `boundsTree`) to three's
# types, so they need to import `three` and therefore need @types/three.
# However, three-mesh-bvh doesn't list @types/three as a dependency. pnpm only
# lets a package see its declared dependencies, so these additions silently
# don't apply. Declaring @types/three as an optional peer dependency here lets
# three-mesh-bvh use the copy that's installed for the workspace.
packageExtensions:
  three-mesh-bvh:
    peerDependencies:
      "@types/three": "*"
    peerDependenciesMeta:
      "@types/three":
        optional: true

packages:
  - "types"


# Enforce a minimum release age to prevent trivial supply chain attacks.
minimumReleaseAge: 1440 # in minutes => 24h

# Disabling pnpm hoisting is recommended on projects using rules_js so that pnpm
# outside of Bazel lays out a node_modules tree similar to what rules_js lays
# out under Bazel (without a hidden node_modules/.pnpm/node_modules).
#
# See documentation for more information:
# https://github.com/aspect-build/rules_js/blob/main/docs/pnpm.md#hoisting
hoist: false

# Always install exact versions rather than ranges.
saveExact: true

# Allow installing dependencies to the root package.json without warnings.
ignoreWorkspaceRootCheck: true

# Packages that are allowed to run their build scripts.
allowBuilds: {}

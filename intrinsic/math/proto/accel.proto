// This proto must not be modified. It is generated by :ros2proto and ensures
// that this message will be natively understood by ROS when sent through DDS.

syntax = "proto3";

package intrinsic_proto;

import "intrinsic/math/proto/vector3.proto";

option go_package = "intrinsic/math/proto/accel_go_proto";

message Accel {
  Vector3 linear = 1;
  Vector3 angular = 2;
}

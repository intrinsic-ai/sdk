syntax = "proto3";

package intrinsic_proto;

option go_package = "intrinsic/math/proto/matrix_go_proto";

message Matrixd {
  int32 rows = 1;
  int32 cols = 2;
  // Stores the values of a matrix in column-major order.
  repeated double values = 3;
}

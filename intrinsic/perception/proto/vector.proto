syntax = "proto3";

package intrinsic_proto.perception;

option go_package = "intrinsic/perception/proto/vector_go_proto";

message Vector4f {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message Vector3f {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Vector2f {
  float x = 1;
  float y = 2;
}

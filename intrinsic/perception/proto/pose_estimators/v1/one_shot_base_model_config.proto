syntax = "proto3";

package intrinsic_proto.perception.v1;

option go_package = "intrinsic/perception/proto/pose_estimators/v1/one_shot_base_model_config_go_proto";

message OneShotBaseModelConfig {
  // Version is needed to ensure that the one-shot base model and the pose
  // estimation service are compatible.
  string version = 3;
  reserved 1, 2;
  reserved "detection_model_path", "visibility_model_path";
}

syntax = "proto3";

package intrinsic_proto.perception.v1;

import "intrinsic/perception/proto/v1/image_buffer.proto";

option go_package = "intrinsic/perception/proto/v1/image_file_reference_go_proto";

// Helper message that contains a reference to an image source file (or file
// matching pattern) along with metadata about the kind of pixel data it
// contains.
message ImageFileReference {
  // Path to a specific image file (relative or absolute), or a filename
  // pattern/suffix (e.g., "_color.png", "*.png") when used as a sensor
  // prototype for scanning a directory.
  string path = 1;
  // Type of the pixel, e.g. intensity vs depth.
  PixelType pixel_type = 2;
  // Number of channels in the image.
  int32 num_channels = 3;
  // Optional source sensor_id.
  optional int64 sensor_id = 4;
}

syntax = "proto3";

package intrinsic_proto.perception.v1;

option go_package = "intrinsic/perception/proto/v1/camera_setup_go_proto";

// The setup of the camera and calibration object relative to the robot.
enum CameraSetup {
  option allow_alias = true;

  CAMERA_SETUP_UNSPECIFIED = 0;
  // The camera is stationary (fixed in world-space/relative to the robot's
  // base). An object is attached (typically a calibration plate) to the
  // robot's flange and was detected in the camera image from varying robot
  // flange positions.
  //
  // Object -?- Flange   "!": known poses (input)
  //   !         !       "-?-": unknown poses (output)
  // Camera -?- Base
  CAMERA_SETUP_STATIONARY = 1;
  // The camera is attached to the robot's flange. A stationary object (fixed
  // in world-space/relative to the robot' base) was detected in the camera
  // image from varying robot flange positions.
  //
  // Camera -?- Flange   "!": known poses (input)
  //   !         !       "-?-": unknown poses (output)
  // Object -?- Base
  CAMERA_SETUP_MOVING = 2;

  // Deprecated: Use CAMERA_SETUP_UNSPECIFIED instead.
  CAMERA_TO_ROBOT_CALIBRATION_TYPE_UNSPECIFIED = 0 [deprecated = true];
  // Deprecated: Use CAMERA_SETUP_STATIONARY instead.
  CAMERA_TO_ROBOT_CALIBRATION_TYPE_STATIONARY_CAMERA = 1 [deprecated = true];
  // Deprecated: Use CAMERA_SETUP_MOVING instead.
  CAMERA_TO_ROBOT_CALIBRATION_TYPE_MOVING_CAMERA = 2 [deprecated = true];
}

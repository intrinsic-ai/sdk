syntax = "proto3";

package intrinsic_proto.world.v1;

import "intrinsic/math/proto/tf_message.proto";
import "third_party/ros2/ros_interfaces/jazzy/sensor_msgs/msg/joint_state.proto";

option go_package = "intrinsic/world/proto/v1/pubsub_world_updates_go_proto";

// Batched state updates message to be published over pubsub.
message PubsubWorldUpdates {
  // Updates for one or more objects in the World.
  repeated PubsubWorldUpdate updates = 1;
}

message PubsubWorldUpdate {
  oneof update {
    // ROS JointState message. Should only be set for a kinematic object.
    // The `header.frame_id` field must specify the name of the World object
    // corresponding to this update.
    sensor_msgs.msg.pb.jazzy.JointState joint_state = 1;
    // TF update for a single object.
    // `transform` can either contain a single TF update for the object, or TF
    // updates corresponding to multiple entities within the object.
    intrinsic_proto.TFMessage transform = 2;
  }
}
